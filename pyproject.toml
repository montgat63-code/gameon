[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamemaster"
version = "0.1.0"
description = "A professional Windows Android device control shell built around the official Scrcpy client"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6,<7",
  "pynput>=1.7.6,<2",
]

[tool.pytest.ini_options]
pythonpath = ["app", "src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}
